[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yake-sum"
version = "0.1.0"
description = "Fast, keyword-guided extractive, abstractive, and hybrid text summarization with YAKE!"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Tiago", email = "tiago@example.com" }
]
keywords = ["nlp", "summarization", "yake", "keywords", "llm", "extractive", "abstractive"]
dependencies = [
    "yake>=0.4.8",
    "rouge-score>=0.1.2",
    "requests>=2.28.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
]
llamacpp = [
    "llama-cpp-python>=0.2.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
yake-sum = "yake_sum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
